<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ravalink</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#08080c;--p1:#0e0e15;--p2:#14141d;--bd:rgba(255,255,255,.09);--tx:#f4f3fb;--mu:#8d8ca3;--a:#c34bff;--btn:#2a1163;--btnh:#37157f;--gr:linear-gradient(135deg,#4d3dff,#c800f0);--ui:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;--mo:"Geist Mono",ui-monospace,Menlo,Consolas,monospace;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 90px);scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font:400 1rem/1.6 var(--ui);overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--a);outline-offset:3px}
.wrap{width:min(1120px,100%);margin:0 auto;padding:0 20px;position:relative}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:13px 22px;border-radius:10px;background:var(--gr);color:#fff;font:500 .95rem var(--ui);text-decoration:none;border:0;cursor:pointer;transition:filter .2s,transform .2s}
.btn:hover{filter:brightness(1.18);transform:translateY(-1px)}
.btn.ghost{background:var(--p2);border:1px solid var(--bd);color:var(--tx)}
.btn.sm{padding:9px 14px;font-size:.88rem}
/* header */
header{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:0;right:0;display:flex;justify-content:center;z-index:58;pointer-events:none}
body.mo{overflow:hidden}
.bar{pointer-events:auto;width:min(1040px,calc(100% - 24px));display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 8px 8px 14px;border:1px solid var(--bd);border-radius:14px;background:rgba(14,14,21,.62);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);transition:background .3s}
.s .bar{background:rgba(14,14,21,.9)}
.logo{display:flex;align-items:center;gap:9px;font:600 1.12rem var(--ui);letter-spacing:-.02em;color:var(--tx);text-decoration:none}
.logo svg{width:30px;height:30px;border-radius:7px}.logo b{font-weight:600;color:var(--a)}
.links{display:flex;gap:2px;align-items:center}
.links a,.lnk{color:var(--mu);text-decoration:none;font:400 .93rem var(--ui);background:none;border:0;cursor:pointer;padding:9px 14px;border-radius:8px;transition:color .2s,background .2s}
.links a:hover,.lnk:hover{color:var(--tx);background:var(--p2)}
.act{display:flex;gap:8px;align-items:center}
.lbtn{display:flex;align-items:center;gap:7px;background:var(--p2);color:var(--tx);border:1px solid var(--bd);border-radius:9px;padding:8px 11px;font:500 .8rem var(--mo);cursor:pointer;transition:border-color .2s}
.lbtn:hover,.lbtn[aria-expanded=true]{border-color:var(--a)}
.burger{display:none;width:38px;height:38px;border-radius:9px;border:1px solid var(--bd);background:var(--p2);cursor:pointer;position:relative}
.burger i{position:absolute;left:10px;right:10px;height:2px;background:var(--tx);border-radius:2px;transition:transform .35s cubic-bezier(.3,.9,.3,1),top .35s}
.burger i:nth-child(1){top:14px}.burger i:nth-child(2){top:21px}
.mo .burger i:nth-child(1){top:18px;transform:rotate(45deg)}.mo .burger i:nth-child(2){top:18px;transform:rotate(-45deg)}
.lp{position:fixed;top:calc(env(safe-area-inset-top,0px) + 76px);right:max(12px,calc(50vw - 520px));width:min(460px,calc(100vw - 24px));max-height:min(70vh,520px);overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:2px;padding:8px;background:var(--p1);border:1px solid var(--bd);border-radius:14px;box-shadow:0 30px 80px -20px rgba(0,0,0,.8);z-index:60;opacity:0;visibility:hidden;transform:translateY(-8px);transition:opacity .2s,transform .3s cubic-bezier(.3,.9,.3,1),visibility .2s}
.lp.open{opacity:1;visibility:visible;transform:none}
.lp button{background:none;border:0;color:var(--tx);font-size:.95rem;text-align:start;padding:10px 12px;border-radius:8px;cursor:pointer}
.lp button:hover{background:var(--p2)}.lp button.on{background:var(--btn);color:#fff}
.bgd{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.55);opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}.bgd.open{opacity:1;visibility:visible}
/* hero */
.hero{position:relative;padding:160px 0 120px;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.pill{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--bd);background:var(--p1);border-radius:999px;padding:6px 14px;font:500 .8rem var(--mo);color:var(--mu);margin-bottom:26px}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--a);animation:pu 2s ease-in-out infinite}
@keyframes pu{50%{opacity:.35;transform:scale(.7)}}
h1,h2{font-weight:500;letter-spacing:-.03em}
h1{font-size:clamp(2.4rem,7vw,4.8rem);line-height:1.05;max-width:12em}
.l{display:block;overflow:hidden;padding-bottom:.12em;margin-bottom:-.12em}
.l i{display:block;font-style:normal}.g{color:var(--mu)}
h1 .l i{transform:translateY(105%);animation:up .9s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--n)*.12s + .15s)}
@keyframes up{to{transform:none}}
.sub{color:var(--mu);font-size:clamp(1.02rem,1.6vw,1.2rem);line-height:1.65;max-width:34em;margin:24px 0 30px}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.win{background:var(--p1);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.wh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--bd);font:500 .78rem var(--mo);color:var(--mu)}
.wh em{font-style:normal;color:#4fdc9c;display:flex;gap:6px;align-items:center}.wh em b{width:6px;height:6px;border-radius:50%;background:#4fdc9c}
.wb{padding:20px}
.hw{margin-top:56px;max-width:560px}
.nodes{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.nd{padding:10px 16px;border:1px solid var(--bd);border-radius:8px;background:var(--p2);font:500 .85rem var(--mo);transition:border-color .4s,color .4s,box-shadow .4s}
.lk{flex:1;height:1px;position:relative;background:repeating-linear-gradient(90deg,var(--mu) 0 4px,transparent 4px 9px)}
.lk i{position:absolute;top:-2.5px;left:0;width:6px;height:6px;border-radius:1px;background:var(--a);animation:pk 2.2s linear infinite;animation-delay:calc(var(--i)*.7s)}
@keyframes pk{to{left:calc(100% - 6px)}}
body[data-m='0'] .lk i{background:#6d6f93;animation-duration:3.6s}
body[data-m='0'] #sv{color:var(--mu)}
body[data-m='1'] #sv{border-color:var(--a);color:#fff;box-shadow:0 0 28px -6px var(--a)}
.host{display:block;font:400 .85rem var(--mo);color:var(--mu);margin-bottom:18px}
.seg{display:inline-flex;background:var(--p2);border:1px solid var(--bd);border-radius:10px;padding:3px;position:relative}
.seg button{position:relative;z-index:1;background:none;border:0;color:var(--mu);font:500 .85rem var(--ui);padding:9px 16px;border-radius:7px;cursor:pointer;transition:color .3s}
.seg button[aria-pressed=true]{color:#fff}
.seg .th{position:absolute;top:3px;bottom:3px;left:3px;border-radius:7px;background:var(--gr);transition:transform .4s cubic-bezier(.3,.9,.3,1),width .4s cubic-bezier(.3,.9,.3,1)}
.pz{position:absolute;right:20px;bottom:20px;width:40px;height:40px;border-radius:10px;border:1px solid var(--bd);background:var(--p1);color:var(--tx);cursor:pointer;display:grid;place-items:center;z-index:3}
body.pa *{animation-play-state:paused!important}
/* sections */
.mq{overflow:hidden;border-block:1px dashed var(--bd);padding:18px 0;direction:ltr}
.mt{display:flex;width:max-content;animation:mq 80s linear infinite}
.mq:hover .mt{animation-play-state:paused}
.mt span{margin:0 6px;padding:8px 16px;border:1px solid var(--bd);border-radius:999px;background:var(--p1);color:var(--mu);white-space:nowrap;font-size:.95rem}
@keyframes mq{to{transform:translateX(-50%)}}
.sec{padding:80px 0;border-top:1px dashed var(--bd)}
.mq+.sec{border-top:0}
.row{display:grid;grid-template-columns:1fr;gap:36px;align-items:center}
@media(min-width:900px){.row{grid-template-columns:1fr 1fr;gap:72px}.row.rev .tx{order:2}}
h2{font-size:clamp(1.8rem,4vw,2.7rem);line-height:1.12}
.tx p{color:var(--mu);margin-top:16px;max-width:30em;font-size:1.05rem}
.rv{opacity:0;transform:translateY(24px);transition:opacity .8s,transform .8s cubic-bezier(.2,.8,.2,1)}.rv.in{opacity:1;transform:none}
.rw{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:15px 16px;border-bottom:1px solid var(--bd);font:500 .85rem var(--mo);animation:hl 4.8s ease-in-out infinite;animation-delay:calc(var(--i)*1.6s)}
.rw:last-child{border-bottom:0}
@keyframes hl{0%,35%,100%{background:transparent}10%,25%{background:rgba(195,75,255,.12)}}
.rw span{display:flex;align-items:center;gap:8px;color:var(--mu)}
.pl{padding:3px 9px;border:1px solid var(--bd);border-radius:6px;color:var(--tx)}
.tm{padding:18px 20px;font:400 .88rem/1.9 var(--mo);overflow-x:auto;direction:ltr;text-align:left}
.tm span{display:block;white-space:pre;opacity:0}
.tm .c{color:var(--a)}.tm .o{color:var(--mu)}.tm .k{color:#4fdc9c}
.in .tm span{animation:ty .01s forwards;animation-delay:calc(var(--i)*.8s + .3s)}
@keyframes ty{to{opacity:1}}
.tm span:last-child::after{content:"▍";color:var(--a);animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.eqc{display:block;width:100%;height:220px}
pre{direction:ltr;text-align:left;padding:20px;font:400 .92rem/1.9 var(--mo);overflow-x:auto}
pre span{display:block;white-space:pre;opacity:0;transform:translateX(-12px);transition:opacity .6s,transform .6s}
.in pre span{opacity:1;transform:none}
.in pre span:nth-child(2){transition-delay:.35s}.in pre span:nth-child(3){transition-delay:.7s}
.rm{color:#ff6b8b}.ad{color:#4fdc9c}.cm{color:var(--mu)}
.fin{position:relative;text-align:center;padding:110px 0 220px;border-top:1px dashed var(--bd);overflow:hidden}
#ca{position:absolute;left:0;right:0;bottom:0;width:100%;height:360px;pointer-events:none}
.fin .wrap{display:flex;flex-direction:column;align-items:center;gap:22px}
.fin svg{width:64px;height:64px;border-radius:14px}
.fin h2 .l i{transform:none}
.fin p{color:var(--mu);font-size:1.1rem}
footer{border-top:1px dashed var(--bd);padding-top:48px;color:var(--mu);font-size:.93rem}
.fg{display:flex;flex-wrap:wrap;gap:28px;justify-content:space-between;align-items:flex-start}
footer .e1c{margin-top:12px}
.fl{display:flex;gap:26px;flex-wrap:wrap}
.fl a,.fl button{color:var(--mu);text-decoration:none;background:none;border:0;font:inherit;cursor:pointer;padding:4px 0;transition:color .2s}
.fl a:hover,.fl button:hover{color:var(--tx)}
.fb{margin-top:34px;padding-top:18px;border-top:1px solid var(--bd);font-size:.85rem}
#fc{display:block;width:100%;height:clamp(90px,17vw,220px);margin-top:20px}
dialog{margin:auto;width:min(680px,calc(100vw - 24px));max-height:86vh;background:var(--p1);color:var(--tx);border:1px solid var(--bd);border-radius:16px;padding:0;overflow:hidden}
dialog::backdrop{background:rgba(0,0,0,.65);backdrop-filter:blur(4px)}
dialog[open]{display:flex;flex-direction:column;animation:dp .35s cubic-bezier(.2,.8,.2,1)}
@keyframes dp{from{opacity:0;transform:translateY(16px) scale(.98)}}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-bottom:1px solid var(--bd);font:500 1.05rem var(--ui)}
.dh button{width:36px;height:36px;border-radius:9px;border:1px solid var(--bd);background:var(--p2);color:var(--tx);cursor:pointer}
.dbd{padding:8px 24px 28px;overflow:auto;line-height:1.65;font-size:.95rem}
.dbd h3{font:500 1rem var(--ui);margin:24px 0 6px}.dbd p{color:var(--mu)}.dbd a{color:var(--a)}

.btn{background:var(--btn);border:1px solid rgba(170,120,255,.32)}
.btn:hover{background:var(--btnh);filter:none;transform:translateY(-1px)}
.btn.ghost{background:var(--p2);border:1px solid var(--bd)}
.btn.ghost:hover{background:var(--p1)}
.mm{position:fixed;top:calc(env(safe-area-inset-top,0px) + 76px);left:12px;right:12px;z-index:56;display:none;background:var(--p1);border:1px solid var(--bd);border-radius:18px;padding:8px;box-shadow:0 30px 80px -20px rgba(0,0,0,.9);opacity:0;visibility:hidden;transform:translateY(-10px) scale(.97);transform-origin:top right;transition:opacity .25s,transform .4s cubic-bezier(.2,.8,.2,1),visibility .25s}
.mo .mm{opacity:1;visibility:visible;transform:none}
.mr{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:17px 16px;border-radius:12px;background:none;border:0;color:var(--tx);font:500 1.1rem var(--ui);letter-spacing:-.01em;text-align:start;text-decoration:none;cursor:pointer;opacity:0;transform:translateY(8px);transition:opacity .4s,transform .45s cubic-bezier(.2,.8,.2,1),background .2s}
.mr:active{background:var(--p2)}
.mr svg{color:var(--mu);flex:none}
.mr small{display:flex;align-items:center;gap:8px;font:500 .78rem var(--mo);color:var(--mu)}.mr small b{font-weight:500}
.mo .mr{opacity:1;transform:none}
.mr+.mr:not(.gh2){border-top:1px solid var(--bd);border-radius:0}
.mr.gh2{justify-content:center;margin-top:8px;background:var(--btn);border:1px solid rgba(170,120,255,.32);font-size:1rem}
.mm>:nth-child(2){transition-delay:.05s}.mm>:nth-child(3){transition-delay:.1s}.mm>:nth-child(4){transition-delay:.15s}.mm>:nth-child(5){transition-delay:.2s}.mm>:nth-child(6){transition-delay:.25s}
@media(max-width:820px){.links,.lbtn{display:none}.burger{display:block}.mm{display:block}.lp{top:auto;bottom:0;left:0;right:0;width:auto;max-height:70vh;border-radius:16px 16px 0 0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:translateY(100%);grid-template-columns:repeat(2,1fr)}.lp.open{transform:none}}
.row h2{max-width:11em}
.lead{color:var(--mu);font-size:clamp(1.05rem,1.8vw,1.3rem);line-height:1.7;max-width:34em}
@media(min-width:900px){.row{align-items:start}}
.steps{list-style:none;padding:0;margin-top:40px;border-top:1px solid var(--bd)}
.steps li{display:grid;grid-template-columns:56px 1fr;gap:12px;padding:26px 0;border-bottom:1px solid var(--bd);align-items:baseline}
.steps b{font:500 .85rem var(--mo);color:var(--a)}
.steps p{font-size:clamp(1.1rem,2.2vw,1.5rem);letter-spacing:-.015em;line-height:1.4}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.card{background:var(--p1);border:1px solid var(--bd);border-radius:14px;padding:28px;transition:border-color .3s,transform .3s cubic-bezier(.2,.8,.2,1)}
.card:hover{border-color:rgba(195,75,255,.45);transform:translateY(-3px)}
.card h3{font:500 1.3rem var(--ui);letter-spacing:-.02em;margin-bottom:12px}
.card p{color:var(--mu)}
.cl{display:flex;flex-wrap:wrap;gap:20px 18px;margin-top:40px;min-height:100px}
.av{display:flex;flex-direction:column;align-items:center;gap:8px;width:84px;color:var(--mu);text-decoration:none;font:400 .76rem var(--mo);transition:transform .25s cubic-bezier(.2,.8,.2,1),color .2s}
.av img,.av .ph{width:64px;height:64px;border-radius:14px;border:1px solid var(--bd);background:var(--p2);object-fit:cover;display:grid;place-items:center;font:600 1.4rem var(--ui);color:#fff}
.av:hover{transform:translateY(-4px);color:var(--tx)}
.av:hover img,.av:hover .ph{border-color:var(--a)}
.av span{max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av.sk{pointer-events:none}.av.sk div{width:64px;height:64px;border-radius:14px;background:var(--p2);animation:sk 1.4s ease-in-out infinite}
@keyframes sk{50%{opacity:.4}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv,.l i,.tm span,pre span{opacity:1!important;transform:none!important}html{scroll-behavior:auto}}
</style>
</head>

<header id='top'><div class='bar'><a class='logo' href='#top'><svg aria-hidden='true'><use href='#r'/></svg><span>Rava<b>link</b></span></a><nav class='links'><a href='#how' class='k1'></a><a href='#cs' class='ctl'></a><a href='docs.html'>Docs</a><a href='https://discord.gg/PBxB5eFNUp target='_blank' rel='noopener'>Discord</a><button type='button' class='lnk lgl' data-open='1'></button></nav><div class='act'><a class='btn sm' href='https://github.com/Ravalink-Project/Ravalink' target='_blank' rel='noopener'>GitHub</a><button id='lb' class='lbtn' type='button' aria-expanded='false' aria-haspopup='true' aria-label='Language'><svg viewBox='0 0 24 24' width='16' height='16' fill='none' stroke='currentColor' stroke-width='1.8' aria-hidden='true'><circle cx='12' cy='12' r='9'/><path d='M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18'/></svg><span class='ln'></span></button><button id='bt' class='burger' type='button' aria-expanded='false' aria-label='Menu'><i></i><i></i></button></div></div></header>
<div id='lp' class='lp'></div><div id='bg' class='bgd'></div>

<a class='mr' href='#cs'><span class='ctl'></span><svg width='16' height='16' viewBox='0 0 16 16' fill='none' stroke='currentColor' stroke-width='1.6' aria-hidden='true'><path d='M6 3l5 5-5 5'/></svg></a>
<a class='mr' href='docs.html'><span>Documentation</span><svg width='16' height='16' viewBox='0 0 16 16' fill='none' stroke='currentColor' stroke-width='1.6' aria-hidden='true'><path d='M6 3l5 5-5 5'/></svg></a><a class='mr' href='https://discord.gg/PBxB5eFNUp' target='_blank' rel='noopener'><span>Discord</span><svg width='16' height='16' viewBox='0 0 16 16' fill='none' stroke='currentColor' stroke-width='1.6' aria-hidden='true'><path d='M6 3l5 5-5 5'/></svg></a><button class='mr' type='button' data-open='1'><span class='lgl'></span><svg width='16' height='16' viewBox='0 0 16 16' fill='none' stroke='currentColor' stroke-width='1.6' aria-hidden='true'><path d='M6 3l5 5-5 5'/></svg></button>
<button class='mr' id='ml' type='button'><span class='lgn'></span><small><svg viewBox='0 0 24 24' width='16' height='16' fill='none' stroke='currentColor' stroke-width='1.8' aria-hidden='true'><circle cx='12' cy='12' r='9'/><path d='M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18'/></svg><b class='ln'></b></small></button>
<a class='mr gh2' href='https://github.com/Ravalink-Project/Ravalink' target='_blank' rel='noopener'>GitHub</a></div>
<section class='hero'><canvas id='cv' aria-hidden='true'></canvas><div class='wrap'>
<div class='pill'><i></i><span id='s'></span></div><h1 id='h'></h1><p class='sub' id='p'></p>
<div class='cta'><a class='btn' href='https://github.com/Ravalink-Project/Ravalink' target='_blank' rel='noopener'>GitHub</a><a class='btn ghost k1' href='#how'></a></div></div>
<button id='pz' class='pz' type='button' aria-pressed='false' aria-label='Pause animations'></button></section>
<section class='sec'><div class='wrap row'><h2 id='w1'></h2><p class='lead' id='w2'></p></div></section>

<section class='sec'><div class='wrap feat'>
<div class='card rv'><h3 id='b'></h3><p id='c1d'></p></div>
<div class='card rv'><h3 id='v1t'></h3><p id='v1d'></p></div>

en:["How it works","Same REST API and WebSocket. Your bot code stays untouched.","Fast and light, with predictable memory and no garbage collector.","Steady audio and low latency, even with many players.","One line to switch","Change the server address in your bot’s config. That’s the whole migration.","Same bot. New engine."],

cs:["Jak to funguje","Stejné REST API a WebSocket. Kód vašeho bota zůstává beze změny.","Rychlý a lehký, s předvídatelnou pamětí a bez garbage collectoru.","Stabilní zvuk a nízká latence i s mnoha přehrávači.","Jeden řádek ke změně","Změňte adresu serveru v konfiguraci bota. To je celá migrace.","Stejný bot. Nový motor."],
ro:["Cum funcționează","Același API REST și WebSocket. Codul botului tău rămâne neschimbat.","Rapid și ușor, cu memorie previzibilă și fără garbage collector.","Sunet stabil și latență mică, chiar cu mulți playeri.","O singură linie de schimbat","Schimbă adresa serverului în configurarea botului. Asta e toată migrarea.","Același bot. Motor nou."],

el:["Πώς λειτουργεί","Ίδιο REST API και WebSocket. Ο κώδικας του bot σας μένει ως έχει.","Γρήγορο και ελαφρύ, με προβλέψιμη μνήμη και χωρίς garbage collector.","Σταθερός ήχος και χαμηλή καθυστέρηση, ακόμη και με πολλούς players.","Μία γραμμή για την αλλαγή","Αλλάξτε τη διεύθυνση του διακομιστή στις ρυθμίσεις του bot. Αυτή είναι όλη η μετάβαση.","Ίδιο bot. Νέα μηχανή."],
ru:["Как это работает","Тот же REST API и WebSocket. Код вашего бота не меняется.","Быстрый и лёгкий, с предсказуемой памятью и без сборщика мусора.","Стабильный звук и малая задержка даже при множестве плееров.","Одна строка для переключения","Измените адрес сервера в настройках бота. Вот и вся миграция.","Тот же бот. Новый движок."],
uk:["Як це працює","Той самий REST API і WebSocket. Код вашого бота не змінюється.","Швидкий і легкий, з передбачуваною пам’яттю та без збирача сміття.","Стабільний звук і мала затримка навіть із багатьма плеєрами.","Один рядок для перемикання","Змініть адресу сервера в налаштуваннях бота. Ось і вся міграція.","Той самий бот. Новий рушій."],
tr:["Nasıl çalışır","Aynı REST API ve WebSocket. Botunun kodu olduğu gibi kalır.","Hızlı ve hafif, öngörülebilir bellek kullanımı ve çöp toplayıcı yok.","Çok sayıda oynatıcıda bile kararlı ses ve düşük gecikme.","Geçiş için tek satır","Botunun yapılandırmasında sunucu adresini değiştir. Tüm geçiş bu kadar.","Aynı bot. Yeni motor."],

he:["איך זה עובד","אותו REST API ואותו WebSocket. הקוד של הבוט נשאר כמות שהוא.","מהיר וקל, עם זיכרון צפוי וללא garbage collector.","סאונד יציב והשהיה נמוכה, גם עם הרבה נגנים.","שורה אחת למעבר","מחליפים את כתובת השרת בהגדרות הבוט. זו כל המיגרציה.","אותו בוט. מנוע חדש."],

en:["An audio server for Discord bots, built in Rust.","Ravalink handles audio for your Discord bot in a separate server, so the bot only needs to send it simple instructions.","What is Ravalink?","Playing music in a voice channel means loading, decoding and streaming audio without a break. Ravalink does this heavy work as a standalone audio node: your bot says what to play, and Ravalink sends the sound to Discord.","Your bot tells Ravalink what to play.","Ravalink loads the audio and streams it to Discord.","Your bot keeps handling commands, free from the audio work.","Built for compatibility","Ravalink aims to work with the Lavalink ecosystem. Compatibility is still being built, and some changes may be needed on your side."],
fr:["Un serveur audio pour bots Discord, écrit en Rust.","Ravalink gère l’audio de votre bot Discord dans un serveur séparé : le bot n’a plus qu’à lui envoyer des instructions simples.","Qu’est-ce que Ravalink ?","Jouer de la musique dans un salon vocal demande de charger, décoder et diffuser du son sans interruption. Ravalink fait ce gros travail comme nœud audio autonome : votre bot dit quoi jouer, et Ravalink envoie le son à Discord.","Votre bot indique à Ravalink quoi jouer.","Ravalink charge l’audio et le diffuse vers Discord.","Votre bot continue de gérer les commandes, sans le travail audio.","Pensé pour la compatibilité","Ravalink vise à fonctionner avec l’écosystème Lavalink. La compatibilité est encore en construction, et certaines modifications peuvent être nécessaires de votre côté."],
es:["Un servidor de audio para bots de Discord, hecho en Rust.","Ravalink gestiona el audio de tu bot de Discord en un servidor aparte, así que el bot solo necesita enviarle instrucciones sencillas.","¿Qué es Ravalink?","Reproducir música en un canal de voz implica cargar, decodificar y transmitir audio sin pausas. Ravalink hace ese trabajo pesado como nodo de audio independiente: tu bot indica qué reproducir y Ravalink envía el sonido a Discord.","Tu bot le dice a Ravalink qué reproducir.","Ravalink carga el audio y lo transmite a Discord.","Tu bot sigue atendiendo comandos, sin la carga del audio.","Pensado para la compatibilidad","Ravalink aspira a funcionar con el ecosistema de Lavalink. La compatibilidad aún se está construyendo y puede que necesites hacer algunos cambios."],
pt:["Um servidor de áudio para bots do Discord, feito em Rust.","O Ravalink cuida do áudio do seu bot do Discord em um servidor separado, então o bot só precisa enviar instruções simples.","O que é o Ravalink?","Tocar música em um canal de voz significa carregar, decodificar e transmitir áudio sem pausas. O Ravalink faz esse trabalho pesado como um nó de áudio independente: seu bot diz o que tocar e o Ravalink envia o som ao Discord.","Seu bot diz ao Ravalink o que tocar.","O Ravalink carrega o áudio e o transmite ao Discord.","Seu bot continua tratando comandos, livre do trabalho de áudio.","Feito para a compatibilidade","O Ravalink busca funcionar com o ecossistema do Lavalink. A compatibilidade ainda está sendo construída e algumas mudanças podem ser necessárias do seu lado."],
de:["Ein Audio-Server für Discord-Bots, gebaut in Rust.","Ravalink übernimmt das Audio deines Discord-Bots auf einem separaten Server, sodass der Bot ihm nur einfache Anweisungen schicken muss.","Was ist Ravalink?","Musik in einem Sprachkanal abzuspielen heißt, Audio ohne Unterbrechung zu laden, zu dekodieren und zu streamen. Ravalink übernimmt diese schwere Arbeit als eigenständiger Audio-Node: Dein Bot sagt, was gespielt werden soll, und Ravalink schickt den Ton an Discord.","Dein Bot sagt Ravalink, was gespielt werden soll.","Ravalink lädt das Audio und streamt es zu Discord.","Dein Bot bearbeitet weiter Befehle, ganz ohne Audio-Last.","Auf Kompatibilität ausgelegt","Ravalink soll mit dem Lavalink-Ökosystem funktionieren. Die Kompatibilität wird noch aufgebaut, und auf deiner Seite können Anpassungen nötig sein."],
it:["Un server audio per bot Discord, scritto in Rust.","Ravalink gestisce l’audio del tuo bot Discord in un server separato, così il bot deve solo inviargli istruzioni semplici.","Che cos’è Ravalink?","Riprodurre musica in un canale vocale significa caricare, decodificare e trasmettere audio senza interruzioni. Ravalink svolge questo lavoro pesante come nodo audio autonomo: il tuo bot dice cosa riprodurre e Ravalink invia il suono a Discord.","Il tuo bot dice a Ravalink cosa riprodurre.","Ravalink carica l’audio e lo trasmette a Discord.","Il tuo bot continua a gestire i comandi, libero dal lavoro audio.","Pensato per la compatibilità","Ravalink punta a funzionare con l’ecosistema Lavalink. La compatibilità è ancora in costruzione e potrebbero servire alcune modifiche da parte tua."],
nl:["Een audioserver voor Discord-bots, gebouwd in Rust.","Ravalink regelt de audio van je Discord-bot op een aparte server, zodat de bot alleen simpele opdrachten hoeft te sturen.","Wat is Ravalink?","Muziek afspelen in een spraakkanaal betekent audio zonder onderbreking laden, decoderen en streamen. Ravalink doet dat zware werk als zelfstandige audionode: je bot zegt wat er gespeeld moet worden en Ravalink stuurt het geluid naar Discord.","Je bot vertelt Ravalink wat er gespeeld moet worden.","Ravalink laadt de audio en streamt die naar Discord.","Je bot blijft opdrachten afhandelen, zonder audiowerk.","Gemaakt voor compatibiliteit","Ravalink wil samenwerken met het Lavalink-ecosysteem. De compatibiliteit wordt nog gebouwd en aan jouw kant zijn mogelijk aanpassingen nodig."],
sv:["En ljudserver för Discord-botar, byggd i Rust.","Ravalink sköter ljudet åt din Discord-bot på en separat server, så boten bara behöver skicka enkla instruktioner.","Vad är Ravalink?","Att spela musik i en röstkanal innebär att ladda, avkoda och strömma ljud utan avbrott. Ravalink gör det tunga jobbet som en fristående ljudnod: din bot säger vad som ska spelas och Ravalink skickar ljudet till Discord.","Din bot talar om för Ravalink vad som ska spelas.","Ravalink laddar ljudet och strömmar det till Discord.","Din bot fortsätter hantera kommandon, utan ljudarbetet.","Byggd för kompatibilitet","Ravalink siktar på att fungera med Lavalink-ekosystemet. Kompatibiliteten byggs fortfarande och vissa ändringar kan behövas hos dig."],
fi:["Äänipalvelin Discord-boteille, tehty Rustilla.","Ravalink hoitaa Discord-bottisi äänen erillisellä palvelimella, joten botin tarvitsee vain lähettää sille yksinkertaisia ohjeita.","Mikä Ravalink on?","Musiikin soittaminen puhekanavalla tarkoittaa äänen lataamista, purkamista ja suoratoistoa keskeytyksittä. Ravalink hoitaa tämän raskaan työn itsenäisenä äänisolmuna: bottisi kertoo, mitä soitetaan, ja Ravalink lähettää äänen Discordiin.","Bottisi kertoo Ravalinkille, mitä soitetaan.","Ravalink lataa äänen ja suoratoistaa sen Discordiin.","Bottisi käsittelee komentoja ilman äänityötä.","Suunniteltu yhteensopivuutta varten","Ravalink tähtää toimimaan Lavalink-ekosysteemin kanssa. Yhteensopivuutta rakennetaan vielä, ja sinun puolellasi voi tarvita muutoksia."],
pl:["Serwer audio dla botów Discorda, napisany w Rust.","Ravalink obsługuje dźwięk twojego bota Discorda na osobnym serwerze, więc bot musi tylko wysyłać mu proste polecenia.","Czym jest Ravalink?","Odtwarzanie muzyki na kanale głosowym wymaga ciągłego ładowania, dekodowania i strumieniowania dźwięku. Ravalink wykonuje tę ciężką pracę jako samodzielny węzeł audio: twój bot mówi, co grać, a Ravalink wysyła dźwięk do Discorda.","Twój bot mówi Ravalinkowi, co odtworzyć.","Ravalink ładuje dźwięk i przesyła go do Discorda.","Twój bot dalej obsługuje komendy, bez pracy nad dźwiękiem.","Stworzony z myślą o zgodności","Ravalink ma działać z ekosystemem Lavalink. Zgodność jest wciąż budowana i po twojej stronie mogą być potrzebne zmiany."],
cs:["Audio server pro boty Discordu, napsaný v Rustu.","Ravalink obsluhuje zvuk vašeho bota na Discordu na samostatném serveru, takže mu bot jen posílá jednoduché pokyny.","Co je Ravalink?","Přehrávání hudby v hlasovém kanálu znamená bez přerušení načítat, dekódovat a streamovat zvuk. Ravalink tuto těžkou práci dělá jako samostatný audio uzel: váš bot řekne, co hrát, a Ravalink pošle zvuk na Discord.","Váš bot řekne Ravalinku, co má hrát.","Ravalink načte zvuk a streamuje ho na Discord.","Váš bot dál vyřizuje příkazy, bez práce se zvukem.","Navrženo pro kompatibilitu","Ravalink se snaží fungovat s ekosystémem Lavalink. Kompatibilita se stále buduje a na vaší straně mohou být potřeba úpravy."],
ro:["Un server audio pentru boți Discord, scris în Rust.","Ravalink se ocupă de sunetul botului tău Discord pe un server separat, așa că botul trebuie doar să îi trimită instrucțiuni simple.","Ce este Ravalink?","Redarea muzicii într-un canal vocal înseamnă încărcarea, decodarea și transmiterea sunetului fără întrerupere. Ravalink face această muncă grea ca nod audio independent: botul tău spune ce să redea, iar Ravalink trimite sunetul către Discord.","Botul tău îi spune lui Ravalink ce să redea.","Ravalink încarcă sunetul și îl transmite către Discord.","Botul tău continuă să primească comenzi, fără munca de sunet.","Gândit pentru compatibilitate","Ravalink își propune să funcționeze cu ecosistemul Lavalink. Compatibilitatea este încă în lucru și pot fi necesare unele modificări din partea ta."],
hu:["Hangszerver Discord-botokhoz, Rustban írva.","A Ravalink külön szerveren kezeli a Discord-botod hangját, így a botnak csak egyszerű utasításokat kell küldenie neki.","Mi az a Ravalink?","A zenelejátszás egy hangcsatornán azt jelenti, hogy megszakítás nélkül kell betölteni, dekódolni és streamelni a hangot. A Ravalink ezt a nehéz munkát önálló hangcsomópontként végzi: a botod megmondja, mit játsszon, a Ravalink pedig elküldi a hangot a Discordnak.","A botod megmondja a Ravalinknek, mit játsszon.","A Ravalink betölti a hangot, és streameli a Discordnak.","A botod tovább kezeli a parancsokat, hangfeldolgozás nélkül.","Kompatibilitásra tervezve","A Ravalink célja, hogy működjön a Lavalink-ökoszisztémával. A kompatibilitás még épül, és nálad is lehetnek szükséges módosítások."],
el:["Ένας διακομιστής ήχου για bots του Discord, γραμμένος σε Rust.","Το Ravalink διαχειρίζεται τον ήχο του bot σου στο Discord σε ξεχωριστό διακομιστή, ώστε το bot να στέλνει μόνο απλές εντολές.","Τι είναι το Ravalink;","Η αναπαραγωγή μουσικής σε φωνητικό κανάλι σημαίνει φόρτωση, αποκωδικοποίηση και ροή ήχου χωρίς διακοπή. Το Ravalink κάνει αυτή τη βαριά δουλειά ως αυτόνομος κόμβος ήχου: το bot σου λέει τι να παίξει και το Ravalink στέλνει τον ήχο στο Discord.","Το bot σου λέει στο Ravalink τι να παίξει.","Το Ravalink φορτώνει τον ήχο και τον στέλνει στο Discord.","Το bot σου συνεχίζει να χειρίζεται εντολές, χωρίς φόρτο ήχου.","Σχεδιασμένο για συμβατότητα","Το Ravalink στοχεύει να λειτουργεί με το οικοσύστημα του Lavalink. Η συμβατότητα βρίσκεται ακόμη υπό κατασκευή και μπορεί να χρειαστούν αλλαγές από τη μεριά σου."],
ru:["Аудиосервер для ботов Discord, написанный на Rust.","Ravalink обрабатывает звук вашего Discord-бота на отдельном сервере, поэтому боту достаточно отправлять ему простые команды.","Что такое Ravalink?","Чтобы играть музыку в голосовом канале, нужно без пауз загружать, декодировать и передавать звук. Ravalink берёт эту тяжёлую работу на себя как автономный аудиоузел: бот говорит, что играть, а Ravalink отправляет звук в Discord.","Ваш бот сообщает Ravalink, что играть.","Ravalink загружает звук и передаёт его в Discord.","Ваш бот продолжает обрабатывать команды без звуковой нагрузки.","Создан для совместимости","Ravalink стремится работать с экосистемой Lavalink. Совместимость ещё разрабатывается, и с вашей стороны могут потребоваться изменения."],
uk:["Аудіосервер для ботів Discord, написаний на Rust.","Ravalink обробляє звук вашого Discord-бота на окремому сервері, тож боту достатньо надсилати йому прості команди.","Що таке Ravalink?","Щоб грати музику в голосовому каналі, потрібно без пауз завантажувати, декодувати й передавати звук. Ravalink бере цю важку роботу на себе як автономний аудіовузол: бот каже, що грати, а Ravalink надсилає звук до Discord.","Ваш бот повідомляє Ravalink, що грати.","Ravalink завантажує звук і передає його до Discord.","Ваш бот і далі обробляє команди без звукового навантаження.","Створений для сумісності","Ravalink прагне працювати з екосистемою Lavalink. Сумісність ще розробляється, і з вашого боку можуть знадобитися зміни."],
tr:["Discord botları için bir ses sunucusu, Rust ile yazıldı.","Ravalink, Discord botunun sesini ayrı bir sunucuda yönetir; böylece botun ona yalnızca basit komutlar göndermesi yeterli olur.","Ravalink nedir?","Bir ses kanalında müzik çalmak, sesi kesintisiz yüklemek, çözmek ve aktarmak demektir. Ravalink bu ağır işi bağımsız bir ses düğümü olarak yapar: botun ne çalınacağını söyler, Ravalink sesi Discord’a gönderir.","Botun, Ravalink’e ne çalacağını söyler.","Ravalink sesi yükler ve Discord’a aktarır.","Botun ses işinden bağımsız olarak komutlara yanıt vermeye devam eder.","Uyumluluk için tasarlandı","Ravalink, Lavalink ekosistemiyle çalışmayı hedefliyor. Uyumluluk hâlâ geliştiriliyor ve senin tarafında bazı değişiklikler gerekebilir."],
ar:["خادم صوت لبوتات ديسكورد، مكتوب بلغة Rust.","يتولّى Ravalink صوت بوت ديسكورد الخاص بك على خادم منفصل، فيكفي أن يرسل إليه البوت تعليمات بسيطة.","ما هو Ravalink؟","تشغيل الموسيقى في قناة صوتية يعني تحميل الصوت وفك ترميزه وبثّه دون انقطاع. يقوم Ravalink بهذا العمل الشاق كعقدة صوت مستقلة: يحدّد بوتك ما يُشغَّل، ويرسل Ravalink الصوت إلى ديسكورد.","يخبر بوتك Ravalink بما يجب تشغيله.","يحمّل Ravalink الصوت ويبثّه إلى ديسكورد.","يواصل بوتك التعامل مع الأوامر دون عبء الصوت.","مصمَّم للتوافق","يهدف Ravalink إلى العمل مع منظومة Lavalink. لا يزال التوافق قيد البناء، وقد تلزم بعض التعديلات من جانبك."],
he:["שרת שמע לבוטים של דיסקורד, כתוב ב-Rust.","Ravalink מטפל בשמע של הבוט שלך בדיסקורד בשרת נפרד, כך שהבוט רק צריך לשלוח לו הוראות פשוטות.","מהו Ravalink?","ניגון מוזיקה בערוץ קולי פירושו טעינה, פענוח והזרמה של שמע ללא הפסקה. Ravalink עושה את העבודה הכבדה הזו כצומת שמע עצמאי: הבוט שלך אומר מה לנגן, ו-Ravalink שולח את הצליל לדיסקורד.","הבוט שלך אומר ל-Ravalink מה לנגן.","Ravalink טוען את השמע ומזרים אותו לדיסקורד.","הבוט שלך ממשיך לטפל בפקודות, בלי עומס השמע.","נבנה לתאימות","Ravalink שואף לעבוד עם המערכת האקולוגית של Lavalink. התאימות עדיין בבנייה, ויתכן שיידרשו שינויים בצד שלך."],
fa:["سرور صوتی برای ربات‌های دیسکورد، نوشته‌شده با Rust.","Ravalink صدای ربات دیسکورد شما را روی یک سرور جداگانه مدیریت می‌کند و ربات فقط باید دستورهای ساده برایش بفرستد.","Ravalink چیست؟","پخش موسیقی در کانال صوتی یعنی بارگیری، رمزگشایی و پخش بی‌وقفهٔ صدا. Ravalink این کار سنگین را به‌عنوان یک گرهٔ صوتی مستقل انجام می‌دهد: ربات شما می‌گوید چه پخش شود و Ravalink صدا را به دیسکورد می‌فرستد.","ربات شما به Ravalink می‌گوید چه پخش کند.","Ravalink صدا را بارگیری می‌کند و به دیسکورد پخش می‌کند.","ربات شما بدون بار صدا به دستورها پاسخ می‌دهد.","ساخته‌شده برای سازگاری","Ravalink می‌خواهد با اکوسیستم Lavalink کار کند. سازگاری هنوز در حال ساخت است و ممکن است در سمت شما تغییراتی لازم باشد."],
hi:["Discord बॉट्स के लिए ऑडियो सर्वर, Rust में बना।","Ravalink आपके Discord बॉट का ऑडियो एक अलग सर्वर पर संभालता है, इसलिए बॉट को बस सरल निर्देश भेजने होते हैं।","Ravalink क्या है?","वॉइस चैनल में संगीत चलाने का मतलब है बिना रुके ऑडियो लोड करना, डिकोड करना और स्ट्रीम करना। Ravalink यह भारी काम एक स्वतंत्र ऑडियो नोड के रूप में करता है: आपका बॉट बताता है कि क्या चलाना है, और Ravalink आवाज़ Discord तक भेजता है।","आपका बॉट Ravalink को बताता है कि क्या चलाना है।","Ravalink ऑडियो लोड करके Discord तक स्ट्रीम करता है।","आपका बॉट ऑडियो के काम के बिना कमांड संभालता रहता है।","संगतता के लिए बना","Ravalink का लक्ष्य Lavalink इकोसिस्टम के साथ काम करना है। संगतता अभी बन रही है, और आपकी ओर से कुछ बदलाव ज़रूरी हो सकते हैं।"],
zh:["面向 Discord 机器人的音频服务器，用 Rust 编写。","Ravalink 在独立的服务器上处理你的 Discord 机器人的音频，机器人只需向它发送简单的指令。","Ravalink 是什么？","在语音频道播放音乐，意味着要不间断地加载、解码并推送音频。Ravalink 作为独立的音频节点承担这些繁重工作：你的机器人说明要播放什么，Ravalink 把声音发送给 Discord。","你的机器人告诉 Ravalink 要播放什么。","Ravalink 加载音频并推送给 Discord。","你的机器人继续处理命令，不再承担音频负担。","为兼容性而设计","Ravalink 的目标是与 Lavalink 生态协同工作。兼容性仍在构建中，你这边可能需要做一些改动。"],
ja:["Discordボット向けのオーディオサーバー、Rust製。","Ravalinkは、Discordボットの音声を別のサーバーで処理します。ボットは簡単な指示を送るだけです。","Ravalinkとは？","ボイスチャンネルで音楽を再生するには、音声を途切れなく読み込み、デコードし、配信し続ける必要があります。Ravalinkはこの重い処理を独立したオーディオノードとして担います。ボットが再生する内容を伝え、RavalinkがDiscordへ音を送ります。","ボットが何を再生するかをRavalinkに伝えます。","Ravalinkが音声を読み込み、Discordへ配信します。","ボットは音声処理から解放され、コマンド処理に専念できます。","互換性を重視して設計","RavalinkはLavalinkのエコシステムとの連携を目指しています。互換性は構築の途中で、あなた側で変更が必要になる場合があります。"],
ko:["Discord 봇을 위한 오디오 서버, Rust로 제작.","Ravalink는 Discord 봇의 오디오를 별도 서버에서 처리하므로, 봇은 간단한 지시만 보내면 됩니다.","Ravalink란?","음성 채널에서 음악을 재생하려면 끊김 없이 오디오를 불러오고, 디코딩하고, 스트리밍해야 합니다. Ravalink는 이 무거운 작업을 독립 오디오 노드로 처리합니다. 봇이 무엇을 재생할지 알려 주면 Ravalink가 소리를 Discord로 보냅니다.","봇이 Ravalink에 무엇을 재생할지 알려 줍니다.","Ravalink가 오디오를 불러와 Discord로 스트리밍합니다.","봇은 오디오 작업 없이 명령 처리에 집중합니다.","호환성을 위해 설계","Ravalink는 Lavalink 생태계와 함께 동작하는 것을 목표로 합니다. 호환성은 아직 구축 중이며, 사용자 쪽에서 일부 수정이 필요할 수 있습니다."],
vi:["Máy chủ âm thanh cho bot Discord, viết bằng Rust.","Ravalink xử lý âm thanh cho bot Discord của bạn trên một máy chủ riêng, nên bot chỉ cần gửi cho nó những chỉ thị đơn giản.","Ravalink là gì?","Phát nhạc trong kênh thoại nghĩa là tải, giải mã và truyền âm thanh liên tục không ngắt quãng. Ravalink đảm nhận phần việc nặng này như một nút âm thanh độc lập: bot của bạn cho biết cần phát gì, Ravalink gửi âm thanh tới Discord.","Bot của bạn cho Ravalink biết cần phát gì.","Ravalink tải âm thanh và truyền tới Discord.","Bot của bạn tiếp tục xử lý lệnh, không phải gánh việc âm thanh.","Thiết kế để tương thích","Ravalink hướng tới việc hoạt động với hệ sinh thái Lavalink. Khả năng tương thích vẫn đang được xây dựng và bạn có thể cần thay đổi một vài thứ ở phía mình."],
th:["เซิร์ฟเวอร์เสียงสำหรับบอต Discord เขียนด้วย Rust","Ravalink จัดการเสียงให้บอต Discord ของคุณบนเซิร์ฟเวอร์แยกต่างหาก บอตจึงแค่ส่งคำสั่งง่ายๆ ให้มัน","Ravalink คืออะไร","การเล่นเพลงในห้องเสียงหมายถึงการโหลด ถอดรหัส และสตรีมเสียงอย่างต่อเนื่องไม่มีสะดุด Ravalink ทำงานหนักนี้ในฐานะโหนดเสียงอิสระ บอตของคุณบอกว่าจะเล่นอะไร แล้ว Ravalink ส่งเสียงไปที่ Discord","บอตของคุณบอก Ravalink ว่าจะเล่นอะไร","Ravalink โหลดเสียงแล้วสตรีมไปที่ Discord","บอตของคุณตอบคำสั่งต่อได้โดยไม่ต้องแบกงานเสียง","ออกแบบเพื่อความเข้ากันได้","Ravalink ตั้งเป้าทำงานร่วมกับระบบนิเวศของ Lavalink ความเข้ากันได้ยังอยู่ระหว่างพัฒนา และอาจต้องมีการปรับบางอย่างในฝั่งของคุณ"],
id:["Server audio untuk bot Discord, dibuat dengan Rust.","Ravalink menangani audio bot Discord Anda di server terpisah, sehingga bot hanya perlu mengirim instruksi sederhana.","Apa itu Ravalink?","Memutar musik di voice channel berarti memuat, men-decode, dan men-stream audio tanpa jeda. Ravalink mengerjakan tugas berat ini sebagai node audio mandiri: bot Anda menyebut apa yang diputar, lalu Ravalink mengirim suaranya ke Discord.","Bot Anda memberi tahu Ravalink apa yang harus diputar.","Ravalink memuat audio dan men-stream-nya ke Discord.","Bot Anda tetap menangani perintah tanpa beban audio.","Dirancang untuk kompatibilitas","Ravalink bertujuan bekerja dengan ekosistem Lavalink. Kompatibilitas masih dibangun, dan mungkin ada perubahan yang perlu dilakukan di sisi Anda."]
